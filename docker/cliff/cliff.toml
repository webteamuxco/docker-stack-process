# git-cliff — generates CHANGELOG.md from Conventional Commits.
# Docs: https://git-cliff.org/docs/configuration

[changelog]
# File header
header = """
# Changelog

All notable changes to this project are documented in this file.\n
The format is based on [Keep a Changelog](https://keepachangelog.com/) and
[Conventional Commits](https://www.conventionalcommits.org/).\n
"""
# Body: one section per version, grouped by commit type
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**({{ commit.scope }})** {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""
# To turn ticket references into links, add a postprocessor, for example:
# postprocessors = [
#   { pattern = '\(PROJ-(\d+)\)', replace = "([PROJ-${1}](https://tracker.example.com/browse/PROJ-${1}))" },
# ]
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true   # ignore non-conventional commits in the changelog
split_commits = false
protect_breaking_commits = true
commit_preprocessors = []

# Commit type -> changelog section mapping. The order sets the display order
# (the HTML comments are stripped from the output and only used for sorting).
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->♻️ Refactoring" },
  { message = "^docs", group = "<!-- 4 -->📚 Documentation" },
  { message = "^test", group = "<!-- 5 -->🧪 Tests" },
  { message = "^build", group = "<!-- 6 -->📦 Build & Dependencies" },
  { message = "^ci", group = "<!-- 7 -->⚙️ CI/CD" },
  { message = "^revert", group = "<!-- 8 -->⏪ Reverts" },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
  { message = ".*", skip = true },
]

# Version tags: v1.2.3
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
