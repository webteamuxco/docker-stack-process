name: commitlint

services:
  # Config: the project's own commitlint.config.{js,cjs,mjs} (at /repo) takes precedence
  # over the stack default (/commitlint.config.js).
  commitlint:
    image: commitlint/commitlint:21.2.3
    profiles:
      - security
    environment:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /repo
    volumes:
      - ${STACK_PROJECT_ROOT:-../..}:/repo:ro
      - ./commitlint.config.js:/commitlint.config.js:ro
    working_dir: /repo
    entrypoint:
      - sh
      - -c
      - |
        config=/commitlint.config.js
        for f in /repo/commitlint.config.js /repo/commitlint.config.cjs /repo/commitlint.config.mjs; do
          if [ -f "$$f" ]; then config="$$f"; break; fi
        done
        echo "commitlint config: $$config" >&2
        exec commitlint --config="$$config" "$$@"
      - commitlint
    command:
      - --last
